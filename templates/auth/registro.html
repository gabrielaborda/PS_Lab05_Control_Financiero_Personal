{% extends "base.html" %}

{% block content %}

<section class="card auth-card p-4">
    <h2>Crear cuenta</h2>

    <p class="form-hint">
        Registra tus datos para acceder al sistema de control financiero.
    </p>

    <form method="POST">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                class="form-control" 
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-control" 
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                required
            >
        </div>

        <div class="mb-3">
            <label for="confirmar_password" class="form-label">Confirmar contraseña</label>
            <input 
                type="password" 
                id="confirmar_password" 
                name="confirmar_password" 
                class="form-control" 
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Registrarme
        </button>
    </form>

    <p class="text-center mt-3 mb-0">
        ¿Ya tienes una cuenta?
        <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </p>
</section>

{% endblock %}

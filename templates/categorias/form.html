<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar' if categoria else 'Nueva' }} Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">{{ 'Editar' if categoria else 'Nueva' }} Categoría</h2>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select" required>
                                <option value="ingreso" {% if categoria and categoria.tipo == 'ingreso' %}selected{% endif %}>Ingreso</option>
                                <option value="gasto" {% if categoria and categoria.tipo == 'gasto' %}selected{% endif %}>Gasto</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ícono (Emoji)</label>
                            <input type="text" name="icono" class="form-control" value="{{ categoria.icono if categoria else '' }}" required placeholder="Ej: 🍔">
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('categorias.lista') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

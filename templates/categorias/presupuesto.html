<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Presupuesto para {{ categoria.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Asignar Presupuesto <span class="fs-3">{{ categoria.icono }}</span></h2>
            <h4 class="text-muted mb-4">{{ categoria.nombre }}</h4>
            
            <div class="card shadow-sm border-info">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Monto Límite (S/)</label>
                            <input type="number" step="0.01" name="monto" class="form-control" value="{{ categoria.presupuesto if categoria.presupuesto else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mes</label>
                            <input type="number" name="mes" class="form-control" min="1" max="12" placeholder="1 al 12" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Año</label>
                            <input type="number" name="anio" class="form-control" placeholder="Ej: 2023" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('categorias.lista') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-info text-white">Guardar Presupuesto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
